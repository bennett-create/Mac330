# Mac330 — Shader Options menu layout
#
# Option *values* are defined in shaders/lib/settings.glsl (and lib/distort.glsl
# for the shadow block). This file only controls how those options are grouped
# into the in-game "Shader Options" screen. Readable names, screen titles and
# tooltips live in shaders/lang/en_us.lang.

# ── Main menu — category buttons open sub-screens ────────────────────────────
screen = [LIGHTING] [GI] [SHADOWS] [SKY] [MATERIALS] [POST] [EXPOSURE]

# ── Lighting: physical light & color temperature ────────────────────────────
screen.LIGHTING = ENABLE_PHYSICAL_LIGHTING ENABLE_LIGHT_TEMPERATURE PHYSICAL_LIGHTING_EXPOSURE SUNLIGHT_INTENSITY SUN_TEMPERATURE_BLEND SKYLIGHT_TEMPERATURE_BLEND CAVE_AMBIENT_LUX BLOCKLIGHT_MAX_LUX

# ── Global illumination (quality nested in its own sub-screen) ───────────────
screen.GI = ENABLE_GI [GI_QUALITY] GI_STRENGTH GI_APPLY_STRENGTH GI_RADIUS GI_MAX_VIEW_DISTANCE GI_SUN_BOUNCE_STRENGTH GI_COLOR_SATURATION GI_DEBUG <empty>
screen.GI_QUALITY = GI_RENDER_SCALE GI_SAMPLES GI_STEPS GI_FILTER_RADIUS GI_SUN_SHADOW_CHECK

# ── Shadows (fine bias tuning nested) ───────────────────────────────────────
screen.SHADOWS = shadowMapResolution SHADOW_SAMPLES SHADOW_RADIUS SHADOW_FILTER_JITTER PIXELATED_SHADOWS PIXELATED_SHADOW_GRID_PHASE PLANT_SHADOWS [SHADOW_TUNING]
screen.SHADOW_TUNING = SHADOW_BIAS SHADOW_SLOPE_BIAS SHADOW_NORMAL_BIAS SHADOW_COMPARE_SOFTNESS

# ── Sky & atmosphere ────────────────────────────────────────────────────────
screen.SKY = ENABLE_REALISTIC_SKY sunPathRotation SKY_EXPOSURE ATMOSPHERE_HAZE SUN_DISK_INTENSITY MOON_DISK_INTENSITY

# ── Materials (subsurface scattering) ───────────────────────────────────────
screen.MATERIALS = ENABLE_SUBSURFACE_SCATTERING <empty> SSS_STRENGTH SSS_TINT_STRENGTH

# ── Post-processing: tonemap + bloom ────────────────────────────────────────
screen.POST = TONEMAP_EXPOSURE <empty> ENABLE_PHYS_BLOOM <empty> BLOOM_STRENGTH BLOOM_RADIUS BLOOM_RESPONSE <empty>

# ── Auto-exposure / eye adaptation (night vision nested) ────────────────────
screen.EXPOSURE = ENABLE_EYE_ADAPTATION [SCOTOPIC] EYE_TARGET_LUMINANCE EYE_CENTER_WEIGHT EYE_MIN_EXPOSURE EYE_MAX_EXPOSURE EYE_LIGHT_ADAPT_SPEED EYE_DARK_ADAPT_SPEED
screen.SCOTOPIC = EYE_SCOTOPIC_BLEND EYE_SCOTOPIC_LUMINANCE EYE_SCOTOPIC_EXPOSURE

# ── Which options render as sliders (everything else is a button) ────────────
sliders = sunPathRotation SKY_EXPOSURE ATMOSPHERE_HAZE SUN_DISK_INTENSITY MOON_DISK_INTENSITY shadowMapResolution PIXELATED_SHADOW_GRID_PHASE SHADOW_SAMPLES SHADOW_RADIUS SHADOW_BIAS SHADOW_SLOPE_BIAS SHADOW_NORMAL_BIAS SHADOW_COMPARE_SOFTNESS SHADOW_FILTER_JITTER SSS_STRENGTH SSS_TINT_STRENGTH BLOOM_STRENGTH BLOOM_RADIUS BLOOM_RESPONSE TONEMAP_EXPOSURE EYE_TARGET_LUMINANCE EYE_MIN_EXPOSURE EYE_MAX_EXPOSURE EYE_LIGHT_ADAPT_SPEED EYE_DARK_ADAPT_SPEED EYE_CENTER_WEIGHT EYE_SCOTOPIC_BLEND EYE_SCOTOPIC_LUMINANCE EYE_SCOTOPIC_EXPOSURE PHYSICAL_LIGHTING_EXPOSURE SUNLIGHT_INTENSITY SUN_TEMPERATURE_BLEND SKYLIGHT_TEMPERATURE_BLEND CAVE_AMBIENT_LUX BLOCKLIGHT_MAX_LUX GI_RENDER_SCALE GI_SAMPLES GI_STEPS GI_FILTER_RADIUS GI_RADIUS GI_STRENGTH GI_APPLY_STRENGTH GI_SUN_BOUNCE_STRENGTH GI_COLOR_SATURATION GI_MAX_VIEW_DISTANCE
